<!doctype html>
<html lang="ja">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Flex Route Assist</title>
<meta name="theme-color" content="#111418" />

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Flex Route" />
<link rel="manifest" href="manifest.webmanifest" />

<style>
:root{--bg:#0e1114;--card:#fff;--orange:#ff5a00;--muted:#717982;--green:#16a05d;--red:#e5483f;--blue:#1778ff;--shadow:0 12px 30px rgba(0,0,0,.18)}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:#eef1f3;color:#111}button,input,textarea{font:inherit}.app{height:100%;display:flex;flex-direction:column}.topbar{height:82px;padding:env(safe-area-inset-top) 16px 8px;background:linear-gradient(180deg,#15191d,#0d0f12);color:#fff;display:flex;align-items:flex-end;justify-content:space-between;z-index:20}.brand{text-align:center;flex:1}.brand b{display:block;font-size:22px;line-height:1.05}.brand span{font-size:13px;opacity:.92;margin-top:4px;display:block}.iconbtn{width:44px;height:44px;border:0;background:transparent;color:#fff;font-size:28px}.view{display:none;flex:1;min-height:0}.view.active{display:flex;flex-direction:column}
#mainView{position:relative}.next-card{position:absolute;z-index:12;left:14px;right:14px;top:12px;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 5px 18px rgba(0,0,0,.24);display:grid;grid-template-columns:92px 1fr;gap:12px;border:1px solid rgba(0,0,0,.06)}.next-num{background:linear-gradient(180deg,#fff7f1,#fff);border-radius:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--orange);min-height:104px}.next-num small{font-weight:700}.next-num strong{font-size:50px;line-height:.95}.addr h2{font-size:16px;margin:0 0 5px;line-height:1.35}.addr p{margin:0 0 7px;font-size:13px;line-height:1.3}.actions{display:flex;gap:10px}.primary,.secondary,.danger{border-radius:12px;padding:10px 12px;font-weight:800;font-size:15px;border:2px solid var(--orange)}.primary{background:var(--orange);color:#fff;flex:1}.secondary{background:#fff;color:var(--orange);flex:1}.danger{background:#fff;color:var(--red);border-color:var(--red)}
.empty-next{grid-column:1/-1;text-align:center;padding:10px 0}.empty-next b{display:block;font-size:20px;margin-bottom:6px}.empty-next p{color:#66707a;margin:0 0 14px}
#map{position:absolute;inset:0}.map-hud{position:absolute;right:14px;top:auto;bottom:calc(166px + env(safe-area-inset-bottom));z-index:11;display:flex;flex-direction:column;gap:8px}.map-hud button{width:48px;height:48px;border-radius:50%;border:0;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.23);font-size:25px;color:#111}.bottomnav{position:absolute;z-index:12;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));height:86px;background:rgba(255,255,255,.97);border-radius:20px;display:grid;grid-template-columns:repeat(3,1fr);box-shadow:0 6px 22px rgba(0,0,0,.24);overflow:hidden;border:1px solid rgba(0,0,0,.05)}.bottomnav button{border:0;background:transparent;font-weight:800;font-size:15px;color:#111}.bottomnav button span{display:block;color:var(--orange);font-size:25px;margin-bottom:3px}
.screen{padding:18px 16px 110px;overflow:auto;background:#f4f6f8}.panel{background:#fff;border-radius:22px;padding:18px;box-shadow:0 6px 18px rgba(0,0,0,.06);margin-bottom:14px}.screen h2{margin:4px 0 14px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}.check{display:flex;gap:12px;align-items:center;font-weight:700}.check input{width:24px;height:24px;accent-color:var(--orange)}.tag{padding:5px 10px;border-radius:999px;background:#fff1e9;color:var(--orange);font-weight:700}.small{font-size:13px;color:var(--muted)}.wide{width:100%;padding:14px;border-radius:14px;border:1px solid #d9dee3;margin-top:8px}.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.toolbar button{flex:1;min-width:76px;padding:11px;border-radius:12px;border:1px solid #ddd;background:#fff}.stop{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;background:#fff;border-radius:18px;padding:14px;margin-bottom:10px}.num{width:36px;height:36px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}.num.active{background:var(--orange)}.stop h3{font-size:16px;margin:0 0 4px}.stop p{font-size:13px;color:#555;margin:0}.distance{text-align:right;font-size:13px;color:#555}.delbtn{border:0;background:#fff0ef;color:var(--red);font-weight:800;border-radius:10px;padding:8px 10px;margin-top:6px}.detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail-actions button{padding:14px;border-radius:14px;border:0;font-weight:700}.save{background:var(--orange);color:#fff}.ghost{background:#f0f2f4}.photo-box{border:2px dashed #c8cdd2;border-radius:18px;padding:24px;text-align:center;background:#fff}.photo-box input{width:100%;margin-top:12px}.preview{display:none;width:100%;max-height:280px;object-fit:cover;border-radius:14px;margin-top:14px}.ocr-result{margin-top:14px}.confidence{font-size:12px;color:#5d6670}.empty-list{text-align:center;padding:60px 20px;color:#6c7580}.empty-list b{display:block;color:#222;font-size:20px;margin-bottom:8px}.ocrbtn{width:100%;margin-top:12px;padding:12px;border:0;border-radius:12px;background:#111;color:#fff;font-weight:700}.loading{opacity:.65;pointer-events:none}
.status-pill{position:absolute;z-index:11;left:50%;transform:translateX(-50%);bottom:calc(112px + env(safe-area-inset-bottom));background:rgba(12,14,17,.94);color:#fff;border-radius:999px;padding:8px 15px;font-size:13px;font-weight:800;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.28)}.status-pill .u{color:#ff6a1a}.status-pill .d{color:#34c773}
.backbar{position:sticky;top:0;z-index:30;margin:-18px -16px 14px;padding:10px 12px;background:rgba(244,246,248,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}.backbtn{border:0;background:#fff;color:#111;border-radius:14px;padding:10px 14px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.08)}
@media(min-width:850px){.app{max-width:520px;margin:0 auto;box-shadow:0 0 40px rgba(0,0,0,.2)}}

/* v13: reference-photo layout */
.topbar{
  height:78px;
  padding:env(safe-area-inset-top) 18px 10px;
  background:linear-gradient(180deg,#111417 0%,#090b0d 100%);
  align-items:flex-end;
  box-shadow:0 1px 0 rgba(255,255,255,.05);
}
.brand b{font-size:23px;font-weight:800;letter-spacing:-.3px}.brand span{font-size:13px;margin-top:5px}
.iconbtn{width:46px;height:46px;font-size:30px;font-weight:300}
#mainView{background:#ddd}
#map{inset:0}
.map-hud{
  right:14px;
  bottom:calc(138px + env(safe-area-inset-bottom));
  gap:9px;
}
.map-hud button{
  width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.98);
  box-shadow:0 4px 14px rgba(0,0,0,.23);font-size:28px;color:#111;border:1px solid rgba(0,0,0,.06)
}
.bottomnav{
  left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));height:108px;
  border-radius:22px;background:rgba(255,255,255,.985);
  box-shadow:0 8px 26px rgba(0,0,0,.22);overflow:visible;padding:10px 8px;
  gap:8px;border:1px solid rgba(0,0,0,.05)
}
.bottomnav button{
  border:1px solid #e0e3e7;border-radius:14px;background:#fff;color:#111;
  font-size:15px;font-weight:800;line-height:1.15
}
.bottomnav button span{font-size:30px;margin-bottom:6px;color:var(--orange)}
.maplibregl-ctrl-bottom-right,.maplibregl-ctrl-bottom-left{bottom:150px!important}


/* v14: actual system layout matching the approved clean reference */
.topbar{height:84px;padding:env(safe-area-inset-top) 18px 10px;align-items:flex-end}
.top-actions{display:flex;align-items:center;gap:4px;min-width:96px;justify-content:flex-end}
.top-mini{font-size:28px;line-height:1}.bell{font-size:27px}
#mainView{position:relative;overflow:hidden}
.map-hud{right:14px;bottom:calc(146px + env(safe-area-inset-bottom));gap:10px}
.map-hud button{width:56px;height:56px;font-size:30px}
.bottomnav{left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));height:112px;padding:12px 10px;border-radius:26px;gap:10px}
.bottomnav button{font-size:16px;border-radius:15px}.bottomnav button span{font-size:31px}
.maplibregl-ctrl-attrib{font-size:9px;opacity:.5}
@media(max-width:390px){.brand b{font-size:21px}.top-actions{min-width:82px}.iconbtn{width:42px}.bottomnav{height:104px}.bottomnav button{font-size:14px}}


/* v17: iPhone safe-area header + smart current-location follow */
.topbar{
  height:auto!important;
  min-height:calc(84px + env(safe-area-inset-top))!important;
  padding:calc(env(safe-area-inset-top) + 8px) 16px 10px!important;
  align-items:flex-end!important;
  flex:0 0 auto;
}
.brand{min-width:0;padding:0 4px}
.brand b{font-size:clamp(20px,5.8vw,24px)!important;white-space:nowrap;overflow:visible;line-height:1.12!important}
.brand span{font-size:14px!important;line-height:1.2;margin-top:5px!important}
.top-actions{min-width:88px!important;flex:0 0 88px}
.topbar>.iconbtn{flex:0 0 46px}
@media(max-width:390px){
  .topbar{padding-left:10px!important;padding-right:10px!important}
  .brand b{font-size:20px!important}
  .top-actions{min-width:78px!important;flex-basis:78px}
  .topbar>.iconbtn{flex-basis:42px}
}

</style>
</head>
<body>
<div class="app">
<header class="topbar"><button class="iconbtn" aria-label="メニュー" onclick="openView('listView')">☰</button><div class="brand"><b>Flex Route Assist</b><span>本日の配達</span></div><div class="top-actions"><button class="iconbtn top-mini" aria-label="メッセージ" onclick="alert('メッセージ機能は後から接続できます')">▢</button><button class="iconbtn top-mini bell" aria-label="通知" onclick="alert('通知はありません')">♧</button></div></header>
<section id="mainView" class="view active">
  <div id="map"></div>
  <div class="map-hud"><button title="現在地" onclick="locateMe(true)">◎</button><button title="拡大" onclick="zoomIn()">＋</button><button title="縮小" onclick="zoomOut()">−</button><button title="レイヤー" onclick="togglePitch()">◆</button></div>
  <div class="bottomnav"><button onclick="optimizeRoute()"><span>⌖</span>近い順</button><button onclick="openView('photoView')"><span>▣</span>写真から住所</button><button onclick="openView('listView')"><span>☷</span>リスト</button></div>
</section>
<section id="detailView" class="view screen"><div class="backbar"><button class="backbtn" onclick="goBack()">← 戻る</button></div><h2>配達先詳細</h2><div id="detailContent"></div></section>
<section id="listView" class="view screen"><div class="backbar"><button class="backbtn" onclick="goBack()">← 戻る</button></div><h2>配達リスト</h2><input class="wide" id="searchBox" placeholder="住所・建物名で検索" oninput="renderList()" /><div class="toolbar"><button onclick="optimizeRoute()">最適ルート</button><button onclick="filterMode('all')">すべて</button><button onclick="filterMode('undelivered')">未配達</button><button onclick="filterMode('done')">完了</button></div><div id="stopList"></div></section>
<section id="photoView" class="view screen"><div class="backbar"><button class="backbtn" onclick="goBack()">← 戻る</button></div><h2>写真から住所追加</h2><div class="photo-box"><b>伝票・住所ラベルを撮影</b><div class="small">読み取り後に必ず確認・修正してから登録します。</div><input id="photoInput" type="file" accept="image/*" capture="environment" onchange="previewPhoto(event)"><img id="preview" class="preview" alt="preview"><button id="ocrBtn" class="ocrbtn" onclick="runOCR()">写真から文字を読み取る</button></div><div class="panel ocr-result"><b>住所（確認・修正）</b><input id="ocrAddress" class="wide" placeholder="例：神奈川県横浜市港北区新横浜2丁目3番8号"><div class="confidence" id="ocrStatus">写真を選択後、「文字を読み取る」を押してください。</div></div><div class="panel"><b>建物名・部屋番号</b><input id="ocrBuilding" class="wide" placeholder="例：○○マンション 102"><b style="display:block;margin-top:12px">メモ</b><textarea id="ocrMemo" class="wide" rows="3" placeholder="置き配場所、入口など"></textarea><div class="row"><label class="check"><input id="ocrDropoff" type="checkbox">置き配</label></div><div class="row"><label class="check"><input id="ocrLocker" type="checkbox">宅配BOXあり</label></div><div class="row"><label class="check"><input id="ocrAutolock" type="checkbox">オートロックあり</label></div></div><button class="primary" style="width:100%" onclick="addStopFromPhoto()">確認した内容で登録</button></section>

</div>
<script>
const KEY='flexStopsV3'; const SEL='flexSelectedV3';
let stops=loadStops(); let selectedId=localStorage.getItem(SEL)||null; let currentMode='all',pitched=false,userPos=null,markers=[],userMarker=null,watchId=null,currentView='mainView',viewStack=[],followMode=true,hasInitialFix=false;
function loadStops(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return []}}
function saveStops(){localStorage.setItem(KEY,JSON.stringify(stops));updateAll()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[139.6152,35.5063],zoom:18.6,pitch:18,bearing:0,antialias:true});
// 自動追従は初期状態ON。ユーザーが地図を動かす/ピンチズームした時だけOFF。現在地ボタンで再開。
map.on('dragstart',e=>{if(e.originalEvent)followMode=false});
map.on('zoomstart',e=>{if(e.originalEvent)followMode=false});
map.on('rotatestart',e=>{if(e.originalEvent)followMode=false});
map.on('load',()=>{try{
  const style=map.getStyle();
  const srcId=Object.keys(style.sources).find(k=>style.sources[k].type==='vector');
  if(srcId&&!map.getLayer('custom-3d-buildings'))map.addLayer({id:'custom-3d-buildings',source:srcId,'source-layer':'building',type:'fill-extrusion',minzoom:14,paint:{'fill-extrusion-color':'#d7d1c6','fill-extrusion-height':['coalesce',['get','render_height'],['get','height'],7],'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':0.72}});
  if(!map.getSource('gsi-buildings'))map.addSource('gsi-buildings',{type:'vector',tiles:['https://cyberjapandata.gsi.go.jp/xyz/experimental_bvmap/{z}/{x}/{y}.pbf'],minzoom:4,maxzoom:16,attribution:'<a href=\"https://maps.gsi.go.jp/vector/\" target=\"_blank\">地理院地図Vector</a>'});
  if(!map.getLayer('gsi-building-footprints'))map.addLayer({id:'gsi-building-footprints',source:'gsi-buildings','source-layer':'building',type:'fill',minzoom:13,paint:{'fill-color':'#d9d5cd','fill-opacity':0.95,'fill-outline-color':'#9e9a92'}});
  if(!map.getLayer('gsi-building-3d'))map.addLayer({id:'gsi-building-3d',source:'gsi-buildings','source-layer':'building',type:'fill-extrusion',minzoom:15,paint:{'fill-extrusion-color':'#cfc9be','fill-extrusion-height':['case',['==',['get','ftCode'],3103],36,['==',['get','ftCode'],3104],22,9],'fill-extrusion-base':0,'fill-extrusion-opacity':0.68}});
}catch(e){console.warn('building overlay',e)} drawMarkers(); startLocationWatch();});
let userHeading=0,prevHeadingPos=null,userArrowEl=null;
function bearingBetween(a,b){
  const r=Math.PI/180,lat1=a.lat*r,lat2=b.lat*r,dLng=(b.lng-a.lng)*r;
  const y=Math.sin(dLng)*Math.cos(lat2);
  const x=Math.cos(lat1)*Math.sin(lat2)-Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLng);
  return (Math.atan2(y,x)/r+360)%360;
}
function distanceMeters(a,b){
  const R=6371000,r=Math.PI/180,dLat=(b.lat-a.lat)*r,dLng=(b.lng-a.lng)*r;
  const q=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(q));
}
function updateHeadingVisual(){
  if(!userArrowEl)return;
  const screenHeading=((userHeading-(map.getBearing?.()||0))+360)%360;
  userArrowEl.style.transform=`translateX(-50%) rotate(${screenHeading}deg)`;
}
function makeUserMarker(){
  if(userMarker)return userMarker;
  const el=document.createElement('div');
  el.style.cssText='width:34px;height:34px;border-radius:50%;background:#1787ff;border:5px solid #fff;box-shadow:0 0 0 14px rgba(23,135,255,.23),0 5px 16px rgba(0,0,0,.35);position:relative;';
  const arrow=document.createElement('div');
  arrow.style.cssText='position:absolute;left:50%;top:-28px;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:24px solid #1787ff;transform-origin:50% 31px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));';
  el.appendChild(arrow);userArrowEl=arrow;
  userMarker=new maplibregl.Marker({element:el,anchor:'center'});
  updateHeadingVisual();
  return userMarker
}
function updateUserPosition(p,recenter=false){
  const next={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy};
  let h=Number(p.coords.heading);
  if(Number.isFinite(h) && h>=0){
    userHeading=h;
  }else if(prevHeadingPos && distanceMeters(prevHeadingPos,next)>=2){
    userHeading=bearingBetween(prevHeadingPos,next);
  }
  if(!prevHeadingPos || distanceMeters(prevHeadingPos,next)>=1) prevHeadingPos={lat:next.lat,lng:next.lng};
  userPos=next;
  makeUserMarker().setLngLat([userPos.lng,userPos.lat]).addTo(map);
  updateHeadingVisual();
  const shouldCenter=recenter || (followMode && currentView==='mainView');
  if(shouldCenter){
    map.easeTo({center:[userPos.lng,userPos.lat],duration:350});
    hasInitialFix=true;
  }
}
map.on('rotate',updateHeadingVisual);
function startLocationWatch(){
  if(!navigator.geolocation)return;
  if(watchId!==null)navigator.geolocation.clearWatch(watchId);
  followMode=true;
  navigator.geolocation.getCurrentPosition(
    p=>updateUserPosition(p,true),
    ()=>{},
    {enableHighAccuracy:true,maximumAge:0,timeout:15000}
  );
  watchId=navigator.geolocation.watchPosition(
    p=>updateUserPosition(p,false),
    ()=>{},
    {enableHighAccuracy:true,maximumAge:0,timeout:15000}
  );
}
function locateMe(recenter){
  followMode=true;
  if(userPos){
    if(recenter)map.easeTo({center:[userPos.lng,userPos.lat],duration:350});
    return;
  }
  navigator.geolocation?.getCurrentPosition(
    p=>updateUserPosition(p,recenter),
    ()=>alert('現在地を取得できませんでした。iPhoneの「設定 → プライバシーとセキュリティ → 位置情報サービス」でSafari / Flex Routeの位置情報を許可してください。'),
    {enableHighAccuracy:true,maximumAge:0,timeout:15000}
  );
}
function clearMarkers(){markers.forEach(m=>m.remove());markers=[]}
function drawMarkers(){clearMarkers();stops.forEach((s,i)=>{if(!Number.isFinite(s.lng)||!Number.isFinite(s.lat))return;const el=document.createElement('div');el.style.cssText=`width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:${s.id===selectedId?'#ff5a00':s.status==='done'?'#16a05d':'#111'};color:#fff;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 5px 12px #0004`;const t=document.createElement('span');t.textContent=i+1;t.style.transform='rotate(45deg)';t.style.fontWeight='800';el.appendChild(t);el.onclick=()=>selectStop(s.id,true);const popup=new maplibregl.Popup({offset:28,closeButton:true}).setHTML(`<div style="font-weight:800;font-size:15px;margin-bottom:4px">${esc(formatJapaneseAddress(s.address))}</div>${s.name?`<div style="font-size:13px">${esc(s.name)}</div>`:''}`);markers.push(new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat([s.lng,s.lat]).setPopup(popup).addTo(map));})}
function counts(){return{u:stops.filter(s=>s.status!=='done').length,d:stops.filter(s=>s.status==='done').length,t:stops.length}}
function nextStop(){return stops.find(s=>s.status!=='done')||null}
function renderStatus(){const el=document.getElementById('statusPill');if(!el)return;const c=counts();el.innerHTML=`未配達 <span class=\"u\">${c.u}</span>　/　完了 <span class=\"d\">${c.d}</span>　/　合計 ${c.t}`;el.style.display=c.t?'block':'none'}
function updateAll(){renderList();drawMarkers()}
function formatJapaneseAddress(addr){
  const raw=String(addr||'').trim();
  if(!raw)return '';
  if(/[丁目番号]/.test(raw))return raw;
  const s=raw.replace(/[‐‑‒–—―ー−ｰ]/g,'-').replace(/\s+/g,'');
  let m=s.match(/^(.*?)(\d+)-(\d+)-(\d+)(.*)$/);
  if(m)return `${m[1]}${m[2]}丁目${m[3]}番${m[4]}号${m[5]}`;
  m=s.match(/^(.*?)(\d+)-(\d+)(.*)$/);
  if(m)return `${m[1]}${m[2]}丁目${m[3]}番${m[4]}`;
  return raw;
}
function renderNext(){const box=document.getElementById('nextCard');if(box)box.style.display='none'}
function openView(id,push=true){if(!document.getElementById(id))return;if(push&&id!==currentView)viewStack.push(currentView);document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');currentView=id;if(id==='mainView')setTimeout(()=>{map.resize()},50);if(id==='listView')renderList()}
function goBack(){const prev=viewStack.pop()||'mainView';openView(prev,false)}
function openSelectedDetail(){const s=stops.find(x=>x.id===selectedId)||nextStop();if(!s){alert('配達先を先に登録してください');openView('photoView');return}selectedId=s.id;localStorage.setItem(SEL,selectedId);renderDetail();openView('detailView')}
function selectStop(id,goMap=false){selectedId=id;localStorage.setItem(SEL,id);const s=stops.find(x=>x.id===id);if(goMap&&s&&Number.isFinite(s.lng))map.easeTo({center:[s.lng,s.lat],zoom:18.5,pitch:pitched?48:0,duration:600});updateAll()}
function renderDetail(){const s=stops.find(x=>x.id===selectedId);const box=document.getElementById('detailContent');if(!s){box.innerHTML='<div class="panel">配達先がありません。</div>';return}const idx=stops.indexOf(s)+1;box.innerHTML=`<div class="panel"><div class="row"><div><b>${idx}　${esc(formatJapaneseAddress(s.address))}</b><div class="small">${esc(s.name||'')}</div></div><span class="tag">${s.status==='done'?'完了':'未配達'}</span></div><div class="row"><label class="check"><input id="dropoff" type="checkbox" ${s.dropoff?'checked':''}>置き配</label></div><div class="row"><label class="check"><input id="locker" type="checkbox" ${s.locker?'checked':''}>宅配ボックスあり</label></div><div class="row"><label class="check"><input id="autolock" type="checkbox" ${s.autolock?'checked':''}>オートロックあり</label></div></div><div class="panel"><b>配達メモ</b><textarea id="memo" class="wide" rows="4">${esc(s.memo||'')}</textarea></div><div class="panel"><div class="row"><div><b>入口位置</b><div class="small">${s.entry?coordText(s.entry):'未保存'}</div></div><button onclick="savePoint('entry')">現在地を保存</button></div><div class="row"><div><b>駐車位置</b><div class="small">${s.parking?coordText(s.parking):'未保存'}</div></div><button onclick="savePoint('parking')">現在地を保存</button></div></div><div class="detail-actions"><button class="save" onclick="saveDetail()">保存</button><button class="danger" onclick="deleteStop('${s.id}')">この配達先を削除</button></div><button class="ghost" style="width:100%;margin-top:10px;padding:14px;border:0;border-radius:14px;font-weight:700" onclick="goBack()">戻る</button>`}
function saveDetail(){const s=stops.find(x=>x.id===selectedId);if(!s)return;s.dropoff=dropoff.checked;s.locker=locker.checked;s.autolock=autolock.checked;s.memo=memo.value.trim();saveStops();renderDetail();alert('配達先情報を保存しました')}
function savePoint(type){const s=stops.find(x=>x.id===selectedId);if(!s)return;navigator.geolocation?.getCurrentPosition(p=>{s[type]={lat:p.coords.latitude,lng:p.coords.longitude};saveStops();renderDetail();alert((type==='entry'?'入口':'駐車')+'位置を保存しました')},()=>alert('現在地を取得できませんでした'),{enableHighAccuracy:true})}
function deleteStop(id){const s=stops.find(x=>x.id===id);if(!s)return;if(!confirm(`「${s.address}」を削除しますか？`))return;stops=stops.filter(x=>x.id!==id);if(selectedId===id)selectedId=stops[0]?.id||null;localStorage.setItem(SEL,selectedId||'');saveStops();openView('listView')}
function markDone(id){const s=stops.find(x=>x.id===id);if(!s)return;s.status='done';saveStops();alert('配達完了にしました')}
function startNav(id){const s=stops.find(x=>x.id===id);if(!s)return;const q=encodeURIComponent(s.address+(s.name?' '+s.name:''));location.href=`https://www.google.com/maps/dir/?api=1&destination=${q}`}
function zoomIn(){map.zoomIn({duration:350})}function zoomOut(){map.zoomOut({duration:350})}function togglePitch(){pitched=!pitched;map.easeTo({pitch:pitched?48:0,bearing:pitched?-18:0,duration:500})}
function hav(a,b){const R=6371,toR=x=>x*Math.PI/180,dLat=toR(b.lat-a.lat),dLng=toR(b.lng-a.lng),x=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function optimizeRoute(){const pending=stops.filter(s=>s.status!=='done'),done=stops.filter(s=>s.status==='done');if(pending.length<2){renderList();openView('listView');return}let cur=userPos||{lat:pending[0].lat,lng:pending[0].lng};let left=[...pending],ordered=[];while(left.length){let best=0,bestD=Infinity;left.forEach((s,i)=>{const d=(Number.isFinite(s.lat)&&Number.isFinite(s.lng)&&Number.isFinite(cur.lat))?hav(cur,s):99999;if(d<bestD){bestD=d;best=i}});const n=left.splice(best,1)[0];ordered.push(n);if(Number.isFinite(n.lat))cur={lat:n.lat,lng:n.lng}}stops=[...ordered,...done];saveStops();renderList();openView('listView')}
function filterMode(m){currentMode=m;renderList()}
function renderList(){const box=document.getElementById('stopList');if(!box)return;const q=(document.getElementById('searchBox')?.value||'').toLowerCase();const list=stops.filter(s=>(currentMode==='all'||s.status===currentMode)&&(`${s.address}${s.name||''}`.toLowerCase().includes(q)));if(!list.length){box.innerHTML=`<div class="empty-list"><b>${stops.length?'該当する配達先がありません':'配達先は0件です'}</b><div>${stops.length?'検索条件を変更してください。':'写真または手入力で登録してください。'}</div></div>`;return}box.innerHTML='';list.forEach(s=>{const idx=stops.indexOf(s)+1;const d=userPos&&Number.isFinite(s.lat)?hav(userPos,s):null;const div=document.createElement('div');div.className='stop';div.innerHTML=`<div class="num ${s.id===selectedId?'active':''}">${idx}</div><div><h3>${esc(s.name||'名称なし')}</h3><p>${esc(formatJapaneseAddress(s.address))}</p></div><div class="distance">${s.status==='done'?'完了':'未配達'}${d!==null?`<br>約 ${d.toFixed(1)} km`:''}<br><button class="delbtn" onclick="event.stopPropagation();deleteStop('${s.id}')">削除</button></div>`;div.onclick=()=>{selectStop(s.id,true);openView('mainView')};box.appendChild(div)})}
function previewPhoto(e){const f=e.target.files?.[0];if(!f)return;const img=document.getElementById('preview');img.src=URL.createObjectURL(f);img.style.display='block';ocrStatus.textContent='写真を選択しました。文字読み取りを実行できます。'}
async function runOCR(){const f=photoInput.files?.[0];if(!f){alert('先に写真を選んでください');return}const btn=ocrBtn;btn.classList.add('loading');btn.textContent='読み取り中…';ocrStatus.textContent='画像を解析しています。少し時間がかかる場合があります。';try{if(!window.Tesseract){await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js')}const r=await Tesseract.recognize(f,'jpn+eng',{logger:m=>{if(m.status==='recognizing text')ocrStatus.textContent=`読み取り中 ${Math.round((m.progress||0)*100)}%`}});const text=(r.data.text||'').replace(/\s+/g,' ').trim();const addr=extractJapaneseAddress(text);ocrAddress.value=addr||text;ocrStatus.textContent=addr?'住所候補を抽出しました。必ず確認・修正してください。':'文字は読み取れました。住所部分だけになるよう修正してください。'}catch(e){ocrStatus.textContent='自動読み取りに失敗しました。住所を手入力してください。'}finally{btn.classList.remove('loading');btn.textContent='写真から文字を読み取る'}}
function extractJapaneseAddress(t){const m=t.match(/(?:〒?\d{3}-?\d{4}\s*)?((?:東京都|北海道|(?:京都|大阪)府|.{2,3}県).{2,40}?(?:\d+[丁目番地号\-−ー]\s*){1,5})/);return m?m[1].replace(/\s+/g,''):''}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function geocode(addr){try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=jp&q=${encodeURIComponent(addr)}`,{headers:{'Accept-Language':'ja'}});const j=await r.json();if(j[0])return{lat:+j[0].lat,lng:+j[0].lon}}catch{}return null}
async function addStopFromPhoto(){const address=formatJapaneseAddress(ocrAddress.value.trim());if(!address){alert('住所を入力してください');return}const btn=event.currentTarget;btn.classList.add('loading');btn.textContent='登録中…';const pos=await geocode(address);const s={id:uid(),address,name:ocrBuilding.value.trim(),memo:ocrMemo.value.trim(),dropoff:ocrDropoff.checked,locker:ocrLocker.checked,autolock:ocrAutolock.checked,status:'undelivered',lat:pos?.lat??null,lng:pos?.lng??null,entry:null,parking:null};stops.push(s);selectedId=s.id;localStorage.setItem(SEL,s.id);saveStops();btn.classList.remove('loading');btn.textContent='確認した内容で登録';ocrAddress.value='';ocrBuilding.value='';ocrMemo.value='';photoInput.value='';preview.style.display='none';if(pos)map.easeTo({center:[pos.lng,pos.lat],zoom:18,duration:600});else alert('住所は登録しましたが、地図上の位置を特定できませんでした。住所を確認してください。');openView('listView')}
function coordText(p){return `${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}`}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
window.addEventListener('load',()=>{updateAll();history.replaceState({view:'mainView'},'');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})});
</script>
