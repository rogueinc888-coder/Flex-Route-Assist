<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Flex Route Assist</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{--bg:#0e1114;--card:#fff;--orange:#ff5a00;--muted:#717982;--green:#16a05d;--red:#dc3b30;--shadow:0 12px 30px rgba(0,0,0,.18)}
*{box-sizing:border-box} html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:#eef1f3;color:#111}
button,input,textarea{font:inherit}.app{height:100%;display:flex;flex-direction:column}.topbar{height:96px;padding:env(safe-area-inset-top) 18px 10px;background:linear-gradient(180deg,#15191d,#0d0f12);color:#fff;display:flex;align-items:flex-end;justify-content:space-between;z-index:20}.brand{text-align:center;flex:1}.brand b{display:block;font-size:24px}.brand span{font-size:14px;opacity:.9}.iconbtn{width:46px;height:46px;border:0;background:transparent;color:#fff;font-size:30px}.view{display:none;flex:1;min-height:0}.view.active{display:flex;flex-direction:column}
#mainView{position:relative}.next-card{position:absolute;z-index:9;left:16px;right:16px;top:14px;background:#fff;border-radius:26px;padding:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:110px 1fr;gap:14px}.next-num{background:radial-gradient(circle,#fff2ea,#fff);border-radius:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--orange)}.next-num small{font-weight:700}.next-num strong{font-size:58px;line-height:1}.addr h2{font-size:19px;margin:0 0 6px}.addr p{margin:0 0 12px;font-size:15px}.actions{display:flex;gap:10px}.primary,.secondary{border-radius:16px;padding:13px 18px;font-weight:700;font-size:18px;border:2px solid var(--orange)}.primary{background:var(--orange);color:#fff;flex:1}.secondary{background:#fff;color:var(--orange);flex:1}
#map{position:absolute;inset:0}.map-hud{position:absolute;right:14px;top:300px;z-index:8;display:flex;flex-direction:column;gap:10px}.map-hud button{width:54px;height:54px;border-radius:50%;border:0;background:#fff;box-shadow:var(--shadow);font-size:28px}.statusbar{position:absolute;z-index:8;bottom:110px;left:50%;transform:translateX(-50%);background:#111;color:#fff;border-radius:18px;padding:10px 18px;font-weight:700;white-space:nowrap}.statusbar .o{color:var(--orange)}.statusbar .g{color:#49d075}.bottomnav{position:absolute;z-index:10;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));height:86px;background:#fff;border-radius:28px;display:grid;grid-template-columns:repeat(3,1fr);box-shadow:var(--shadow);overflow:hidden}.bottomnav button{border:0;background:#fff;font-weight:700;font-size:16px}.bottomnav button span{display:block;color:var(--orange);font-size:28px;margin-bottom:4px}
.screen{padding:18px 16px 110px;overflow:auto;background:#f4f6f8}.panel{background:#fff;border-radius:22px;padding:18px;box-shadow:0 6px 18px rgba(0,0,0,.06);margin-bottom:14px}.screen h2{margin:4px 0 14px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}.check{display:flex;gap:12px;align-items:center;font-weight:700}.check input{width:24px;height:24px;accent-color:var(--orange)}.tag{padding:5px 10px;border-radius:999px;background:#fff1e9;color:var(--orange);font-weight:700}.small{font-size:13px;color:var(--muted)}.wide{width:100%;padding:14px;border-radius:14px;border:1px solid #d9dee3}.toolbar{display:flex;gap:10px;margin-bottom:12px}.toolbar button{flex:1;padding:11px;border-radius:12px;border:1px solid #ddd;background:#fff}.stop{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;background:#fff;border-radius:18px;padding:14px;margin-bottom:10px}.num{width:36px;height:36px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}.num.active{background:var(--orange)}.stop h3{font-size:16px;margin:0 0 4px}.stop p{font-size:13px;color:#555;margin:0}.distance{text-align:right;font-size:13px;color:#555}.detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail-actions button{padding:14px;border-radius:14px;border:0;font-weight:700}.save{background:var(--orange);color:#fff}.ghost{background:#f0f2f4}.photo-box{border:2px dashed #c8cdd2;border-radius:18px;padding:24px;text-align:center;background:#fff}.photo-box input{width:100%;margin-top:12px}.preview{display:none;width:100%;max-height:280px;object-fit:cover;border-radius:14px;margin-top:14px}.ocr-result{margin-top:14px}.confidence{font-size:12px;color:#5d6670}.screen-nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:30}.screen-nav button{border:0;background:#fff;padding:8px 4px;font-size:12px}.screen-nav b{display:block;font-size:22px;color:var(--orange)}
.zoom-tip{position:absolute;z-index:7;left:16px;bottom:210px;background:rgba(255,255,255,.92);padding:8px 12px;border-radius:12px;font-size:12px;box-shadow:0 4px 12px rgba(0,0,0,.12)}
@media(min-width:850px){.app{max-width:520px;margin:0 auto;box-shadow:0 0 40px rgba(0,0,0,.2)}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar"><button class="iconbtn" onclick="openView('listView')">☰</button><div class="brand"><b>Flex Route Assist</b><span>本日の配達</span></div><button class="iconbtn" onclick="openView('detailView')">☷</button></header>

  <section id="mainView" class="view active">
    <div id="map"></div>
    <div class="next-card">
      <div class="next-num"><small>次の配達</small><strong>12</strong></div>
      <div class="addr"><h2>神奈川県横浜市港北区新横浜2-3-8</h2><p>サンプルマンション 102</p><p><span class="tag">メモ</span> 置き配・宅配BOX / 入口は建物裏</p><div class="actions"><button class="primary" onclick="alert('ナビを開始します')">➤ ナビ開始</button><button class="secondary" onclick="markDone()">✓ 完了</button></div></div>
    </div>
    <div class="map-hud"><button onclick="zoomIn()">＋</button><button onclick="zoomOut()">−</button><button onclick="locateMe()">◎</button><button onclick="togglePitch()">◈</button></div>
    <div class="zoom-tip" id="zoomTip">拡大：建物・細街路を詳細表示</div>
    <div class="statusbar">未配達 <span class="o" id="undeliveredCount">38</span> / 完了 <span class="g" id="doneCount">12</span> / 合計 50</div>
    <div class="bottomnav"><button onclick="sortByDistance()"><span>⌖</span>近い順</button><button onclick="openView('photoView')"><span>▣</span>写真から住所</button><button onclick="openView('listView')"><span>☷</span>リスト</button></div>
  </section>

  <section id="detailView" class="view screen">
    <h2>配達先詳細</h2>
    <div class="panel"><div class="row"><div><b>12　神奈川県横浜市港北区新横浜2-3-8</b><div class="small">サンプルマンション 102</div></div><span class="tag">未配達</span></div>
      <div class="row"><label class="check"><input id="dropoff" type="checkbox" checked>置き配</label></div>
      <div class="row"><label class="check"><input id="locker" type="checkbox" checked>宅配ボックスあり</label></div>
      <div class="row"><label class="check"><input id="autolock" type="checkbox">オートロックあり</label></div>
    </div>
    <div class="panel"><b>配達メモ</b><textarea id="memo" class="wide" rows="4">入口は建物裏。夜はインターホン不要。</textarea></div>
    <div class="panel"><div class="row"><div><b>入口位置</b><div class="small">建物裏の通用口付近</div></div><button onclick="savePoint('入口')">保存</button></div><div class="row"><div><b>駐車位置</b><div class="small">マンション前スペース</div></div><button onclick="savePoint('駐車')">保存</button></div></div>
    <div class="detail-actions"><button class="save" onclick="saveDetail()">保存</button><button class="ghost" onclick="openView('mainView')">地図へ戻る</button></div>
  </section>

  <section id="listView" class="view screen">
    <h2>配達リスト</h2>
    <input class="wide" id="searchBox" placeholder="住所・建物名で検索" oninput="filterStops()" />
    <div class="toolbar"><button onclick="sortByDistance()">近い順</button><button onclick="filterMode('all')">すべて</button><button onclick="filterMode('undelivered')">未配達</button></div>
    <div id="stopList"></div>
  </section>

  <section id="photoView" class="view screen">
    <h2>写真から住所追加</h2>
    <div class="photo-box"><b>伝票・住所ラベルを撮影</b><div class="small">撮影後、住所候補を確認してから登録します。</div><input type="file" accept="image/*" capture="environment" onchange="previewPhoto(event)"><img id="preview" class="preview" alt="preview"></div>
    <div class="panel ocr-result"><b>読み取り結果</b><input id="ocrAddress" class="wide" value="神奈川県横浜市港北区新横浜2-3-8"><div class="confidence">認識結果は必ず確認してから登録してください。</div></div>
    <div class="panel"><input id="ocrBuilding" class="wide" value="サンプルマンション 102" placeholder="建物名・部屋番号"><textarea id="ocrMemo" class="wide" rows="3" placeholder="メモ"></textarea></div>
    <button class="primary" style="width:100%" onclick="addStopFromPhoto()">地図に追加</button>
  </section>

  <nav class="screen-nav"><button onclick="openView('mainView')"><b>⌖</b>地図</button><button onclick="openView('detailView')"><b>✓</b>詳細</button><button onclick="openView('listView')"><b>☷</b>リスト</button><button onclick="openView('photoView')"><b>▣</b>写真</button></nav>
</div>
<script>
const stops=[
 {n:9,address:'新横浜2-6',name:'横浜アリーナ',d:.4,status:'undelivered',lng:139.6152,lat:35.5097},
 {n:10,address:'新横浜2-15',name:'新横浜二丁目',d:.6,status:'undelivered',lng:139.6138,lat:35.5084},
 {n:11,address:'新横浜3-8',name:'新横浜プリンスペペ',d:.7,status:'undelivered',lng:139.6118,lat:35.5054},
 {n:12,address:'新横浜2-3-8',name:'サンプルマンション102',d:1.2,status:'undelivered',lng:139.6154,lat:35.5069},
 {n:13,address:'新横浜2-2',name:'パークスクエア新横浜',d:.8,status:'undelivered',lng:139.6180,lat:35.5068},
 {n:14,address:'新横浜2-17',name:'新横浜二丁目公園',d:1.0,status:'done',lng:139.6165,lat:35.5043},
 {n:15,address:'新横浜3-8',name:'まいばすけっと新横浜店',d:.5,status:'done',lng:139.6147,lat:35.5028}
];
let currentMode='all',pitched=true;
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[139.6152,35.5063],zoom:16.7,pitch:48,bearing:-18,antialias:true});
map.addControl(new maplibregl.NavigationControl({showCompass:false,showZoom:false}));
map.on('load',()=>{
  try{
    const style=map.getStyle();
    const srcId=Object.keys(style.sources).find(k=>style.sources[k].type==='vector');
    if(srcId){map.addLayer({id:'custom-3d-buildings',source:srcId,'source-layer':'building',type:'fill-extrusion',minzoom:15,paint:{'fill-extrusion-color':['interpolate',['linear'],['get','render_height'],0,'#e8e2d6',80,'#c7bba8'],'fill-extrusion-height':['coalesce',['get','render_height'],['get','height'],8],'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':0.78}});}
  }catch(e){console.log('3D layer fallback',e)}
  drawMarkers();
});
map.on('zoom',()=>{const z=map.getZoom();document.getElementById('zoomTip').textContent=z>=17?'高詳細：建物形状・細街路・周辺施設':'広域表示：道路網と配達エリアを俯瞰';});
function drawMarkers(){stops.forEach(s=>{const el=document.createElement('div');el.style.cssText=`width:38px;height:38px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:${s.n===12?'#ff5a00':'#111'};color:#fff;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 5px 12px #0004`;const t=document.createElement('span');t.textContent=s.n;t.style.transform='rotate(45deg)';t.style.fontWeight='800';el.appendChild(t);new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat([s.lng,s.lat]).addTo(map);});}
function openView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='mainView')setTimeout(()=>map.resize(),50);if(id==='listView')renderList();}
function zoomIn(){map.zoomIn({duration:450})}function zoomOut(){map.zoomOut({duration:450})}
function togglePitch(){pitched=!pitched;map.easeTo({pitch:pitched?48:0,bearing:pitched?-18:0,duration:600})}
function locateMe(){navigator.geolocation?.getCurrentPosition(p=>map.easeTo({center:[p.coords.longitude,p.coords.latitude],zoom:17.5,duration:700}),()=>alert('現在地を取得できませんでした'))}
function markDone(){document.getElementById('undeliveredCount').textContent='37';document.getElementById('doneCount').textContent='13';alert('12番を配達完了にしました')}
function sortByDistance(){stops.sort((a,b)=>a.d-b.d);renderList();openView('listView')}
function renderList(){const q=(document.getElementById('searchBox')?.value||'').toLowerCase();const box=document.getElementById('stopList');box.innerHTML='';stops.filter(s=>(currentMode==='all'||s.status===currentMode)&&(`${s.address}${s.name}`.toLowerCase().includes(q))).forEach(s=>{const div=document.createElement('div');div.className='stop';div.innerHTML=`<div class="num ${s.n===12?'active':''}">${s.n}</div><div><h3>${s.name}</h3><p>${s.address}</p></div><div class="distance">${s.status==='done'?'完了':'未配達'}<br>→ ${s.d.toFixed(1)} km</div>`;div.onclick=()=>{map.easeTo({center:[s.lng,s.lat],zoom:18,pitch:48,duration:700});openView('mainView')};box.appendChild(div)});}
function filterStops(){renderList()}function filterMode(m){currentMode=m;renderList()}
function saveDetail(){localStorage.setItem('flexDetail',JSON.stringify({dropoff:dropoff.checked,locker:locker.checked,autolock:autolock.checked,memo:memo.value}));alert('配達先情報を保存しました')}
function savePoint(type){alert(type+'位置を現在地として保存しました')}
function previewPhoto(e){const f=e.target.files?.[0];if(!f)return;const img=document.getElementById('preview');img.src=URL.createObjectURL(f);img.style.display='block';}
function addStopFromPhoto(){alert('確認した住所を配達リストに追加しました');openView('listView')}
window.addEventListener('load',()=>{const v=localStorage.getItem('flexDetail');if(v){try{const d=JSON.parse(v);dropoff.checked=d.dropoff;locker.checked=d.locker;autolock.checked=d.autolock;memo.value=d.memo}catch{}}renderList()});
</script>
</body>
</html>
